name: cflite-pr

# Coverage-guided fuzzing of the parsers in fuzz/ for every pull request that
# can change their behavior. Crashes fail the check and upload a reproducer.
on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    name: Fuzz target (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_aibom_import, fuzz_raw_evidence, fuzz_strict_json, fuzz_webhook_signatures]
    permissions:
      actions: read # read ClusterFuzzLite workflow artifacts
      contents: read
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        env:
          CFL_EXTRA_FUZZ_TARGET: ${{ matrix.target }}
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          # Every target has its own runner; none is discarded by change filtering.
          keep-unaffected-fuzz-targets: true
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Preserve the original 300-second budget: at least 75 seconds per target.
          fuzz-seconds: 75
          mode: code-change
          sanitizer: address

  fuzz:
    name: Fuzz pull request (address)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: targets
    if: always()
    steps:
      - name: Require every fuzz target to pass
        env:
          FUZZ_RESULT: ${{ needs.targets.result }}
        run: test "$FUZZ_RESULT" = success
